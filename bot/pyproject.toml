[project]
name = "crypto-trading-bot"
version = "0.1.0"
description = "Autonomous crypto trading bot: research, backtest engine, strategies, risk, paper trading."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16.0",
    "ccxt>=4.3",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "tenacity>=8.3",
    "python-dotenv>=1.0",
    "streamlit>=1.35",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "responses>=0.25",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["settings"]
packages = [
    "engine",
    "indicators",
    "strategies",
    "risk",
    "evaluation",
    "optimization",
    "live",
    "data",
    "guard",
    "dashboard",
]
